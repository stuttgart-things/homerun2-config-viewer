---
name: Cleanup PR Artifacts
on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  cleanup:
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-cleanup-pr-artifacts.yaml@main
    with:
      runs-on: ubuntu-latest
      # The -kustomize package is added once the KCL deployment (#7) pushes it:
      # the template fails on a package that does not exist yet.
      packages: homerun2-config-viewer
      dry-run: false
    secrets: inherit # pragma: allowlist secret
