---
name: Release
on:
  # Manual only until v1 is feature-complete (#11): semantic-release would
  # otherwise publish an unfinished viewer as v1.0.0 on the next merge. Switch
  # to the workflow_run trigger below, as the sibling services use, when #9 is
  # done.
  #
  # workflow_run:
  #   workflows: ["Build, Push & Scan Container Image"]
  #   types: [completed]
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-go-release.yaml@main
    with:
      runs-on: ubuntu-latest
      stage-image: true
      # Moves :latest onto every release. Without it only the version tag is
      # written, and :latest - the KCL default image - never exists on ghcr
      # (homerun2-omni-pitcher#165).
      image-extra-tags: latest
      push-kustomize: true
      kcl-source-dir: kcl
      kcl-profile-file: tests/kcl-deploy-profile.yaml
      # Pins the released version into config.image, so the published
      # kustomize base references a real tag, not the profile's :latest
      # placeholder (homerun2-omni-pitcher#160).
      kustomize-image-key: config.image
      kustomize-oci-repo: ghcr.io/stuttgart-things/homerun2-config-viewer-kustomize
    secrets: inherit # pragma: allowlist secret
